train:
  data-root: data/cityscape
  dataset: cityscapes
  cs-mode: auto
  encoder: b2
  num-classes: 19
  size: [512, 1024]
  batch-size: 4
  epochs: 80
  lr: 0.0003
  weight-decay: 0.01
  workers: 8
  ignore-index: 255
  out-dir: runs/cs_exp
  save-every: 5
  seed: 42
  max-grad-norm: 1.0
  save-val-pred: false
  eval: false
  load:
